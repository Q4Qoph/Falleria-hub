name: Build and deploy Next.js app to Azure Web App - falleria-hub-international

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Verify build
        run: ls -la .next

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: next-app
          path: |
            .next
            package.json
            package-lock.json
            node_modules

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write  # Required for OIDC login
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: next-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BEA7EC20F225411584F9BA044181DB41 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_462098E4B2AB47FB8FE2FC0AB0F588B3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1F40BF09942E436693E09E63B1398581 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'falleria-hub-international'
          slot-name: 'Production'
          package: .
